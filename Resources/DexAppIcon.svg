<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Key chord app icon</title>
  <desc id="desc">Four rounded white diagonal strokes forming a broken X on a pink macOS squircle.</desc>

  <defs>
    <clipPath id="squircle-clip">
      <path d="M512 64
               C278 64 183 64 123 123
               C64 183 64 278 64 512
               C64 746 64 841 123 901
               C183 960 278 960 512 960
               C746 960 841 960 901 901
               C960 841 960 746 960 512
               C960 278 960 183 901 123
               C841 64 746 64 512 64Z" />
    </clipPath>

    <linearGradient id="pink-base"
                    x1="150" y1="900"
                    x2="830" y2="120"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8D3157" />
      <stop offset="0.36" stop-color="#D8789B" />
      <stop offset="0.72" stop-color="#F6B4CD" />
      <stop offset="1" stop-color="#FFD8E6" />
    </linearGradient>

    <radialGradient id="pink-bloom"
                    cx="0.78" cy="0.12" r="0.76"
                    fx="0.78" fy="0.12">
      <stop offset="0" stop-color="#FFF1F6" stop-opacity="0.82" />
      <stop offset="0.34" stop-color="#F6B4CD" stop-opacity="0.42" />
      <stop offset="0.78" stop-color="#F6B4CD" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="edge-sheen"
                    x1="280" y1="65"
                    x2="725" y2="965"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.11" />
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="1" stop-color="#3D1025" stop-opacity="0.26" />
    </linearGradient>

    <linearGradient id="mark-white"
                    x1="380" y1="330"
                    x2="650" y2="700"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFF8FB" />
    </linearGradient>

    <filter id="icon-shadow"
            x="-20%" y="-20%"
            width="140%" height="150%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="shadow-blur" />
      <feOffset in="shadow-blur" dx="0" dy="17" result="shadow-offset" />
      <feFlood flood-color="#4A142B" flood-opacity="0.26" result="shadow-color" />
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="mark-glow"
            x="-45%" y="-45%"
            width="190%" height="190%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur" />
      <feFlood flood-color="#FFE3ED" flood-opacity="0.52" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g id="app-icon">
    <g id="squircle-background"
       transform="translate(41.142857 41.142857) scale(0.919642857)"
       filter="url(#icon-shadow)">
      <!-- Continuous-corner macOS-style squircle. -->
      <path d="M512 64
               C278 64 183 64 123 123
               C64 183 64 278 64 512
               C64 746 64 841 123 901
               C183 960 278 960 512 960
               C746 960 841 960 901 901
               C960 841 960 746 960 512
               C960 278 960 183 901 123
               C841 64 746 64 512 64Z"
            fill="url(#pink-base)" />

      <g clip-path="url(#squircle-clip)">
        <rect x="64" y="64" width="896" height="896"
              fill="url(#pink-bloom)" />
        <rect x="64" y="64" width="896" height="896"
              fill="url(#edge-sheen)" />

        <!-- Hairline rim preserves the silhouette against dark wallpapers. -->
        <path d="M512 66
                 C279 66 184 66 125 125
                 C66 184 66 279 66 512
                 C66 745 66 840 125 899
                 C184 958 279 958 512 958
                 C745 958 840 958 899 899
                 C958 840 958 745 958 512
                 C958 279 958 184 899 125
                 C840 66 745 66 512 66Z"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="4"
              stroke-opacity="0.075" />
      </g>
    </g>

    <!--
      Core logo. These four paths are deliberately independent so the
      center remains open and the mark survives at menu-bar scale.
    -->
    <g id="chord-mark"
       fill="none"
       stroke="url(#mark-white)"
       stroke-width="62"
       stroke-linecap="round"
       filter="url(#mark-glow)">
      <path id="stroke-northwest" d="M350 350 L456 456" />
      <path id="stroke-northeast" d="M568 456 L674 350" />
      <path id="stroke-southwest" d="M456 568 L350 674" />
      <path id="stroke-southeast" d="M568 568 L674 674" />
    </g>
  </g>
</svg>
