<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="256"
     height="256"
     viewBox="0 0 256 256"
     color="#000000"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Key chord symbol</title>
  <desc id="desc">Four rounded diagonal strokes forming a broken X.</desc>

  <!--
    Monochrome companion mark for menu-bar and small UI use.
    The stroke inherits currentColor, so it can be tinted without editing paths.
  -->
  <g id="chord-mark"
     fill="none"
     stroke="currentColor"
     stroke-width="24"
     stroke-linecap="round">
    <path id="stroke-northwest" d="M62 62 L107 107" />
    <path id="stroke-northeast" d="M149 107 L194 62" />
    <path id="stroke-southwest" d="M107 149 L62 194" />
    <path id="stroke-southeast" d="M149 149 L194 194" />
  </g>
</svg>
